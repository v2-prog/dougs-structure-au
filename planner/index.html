<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bracket — Economic Life Stages</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --bg: #0f1f14; --panel: #1a2e1a; --fg: #f5f0e6; --gold: #c5a46e; --line: #2a4030; }
    body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
    details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
    summary { padding: 12px; cursor: pointer; background: linear-gradient(180deg, #1a2e1a, #152418); list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .chev { display: inline-block; width: 8px; height: 8px; border-right: 2px solid var(--gold); border-bottom: 2px solid var(--gold); transform: rotate(45deg); }
    details[open] .chev { transform: rotate(225deg); }
    .i { width: 24px; height: 24px; stroke: #c5a46e; fill: none; stroke-width: 1.8; }
  </style>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h4l4 8M10 8l3 8"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="M4 16v-4l2-5h12l2 5v4M4 16h16M4 16v2M20 16v2"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/></symbol>
    <symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5zM6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10M10 20v-6h4v6"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c0-4 2.7-6 6.5-6s6.5 2 6.5 6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></symbol>
  </svg>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-6xl mx-auto">
    <header class="flex flex-wrap justify-between items-end gap-4 mb-8">
      <div>
        <a href="/" class="text-[#c5a46e] text-sm">← Bracket</a>
        <h1 class="text-3xl md:text-4xl font-bold mt-1">Economic Life Stages</h1>
        <p class="text-[#c5a46e] mt-1 max-w-xl">Two years at a time. Open a card for the key changes, then go deeper for scenarios, government links, forms and tools.</p>
      </div>
      <div class="space-x-2">
        <button id="open-all" class="bg-[#c5a46e] text-[#0f1f14] px-4 py-2 rounded font-medium">Open all</button>
        <button id="close-all" class="border border-[#c5a46e] text-[#c5a46e] px-4 py-2 rounded font-medium">Close all</button>
      </div>
    </header>

    <div id="rows" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <footer class="mt-12 text-sm text-[#c5a46e]/80">
      Averages for Australia. Age 60 preservation (born after 1 July 1964), Age Pension age 67. Educational only — not personal advice.
    </footer>
  </div>

  <script>
    const bands = [
      ["12-13", "bike", "Foundations, pocket money, first habits"],
      ["14-15", "phone", "Casual jobs, phone, early saving"],
      ["16-17", "car", "Learner licence, TFN, bank account"],
      ["18-19", "cap", "Voting, study, HELP, first work"],
      ["20-21", "home", "First car, share house or home, early career"],
      ["30-31", "person", "First child, parental leave, household shift"],
      ["40-41", "chart", "Peak family costs, career growth, super top-ups"],
      ["50-51", "chart", "Peak accumulation, family transition"],
      ["66-67", "sun", "Age Pension, drawdown, succession"]
    ];
    const root = document.getElementById("rows");
    bands.forEach(([age, icon, desc]) => {
      root.insertAdjacentHTML("beforeend", `
        <details class="bg-[#1a2e1a] border border-[#2a4030] rounded-lg overflow-hidden">
          <summary class="p-4 cursor-pointer">
            <div class="flex justify-between items-center">
              <span class="font-bold text-lg">${age}</span>
              <span class="chev"></span>
            </div>
            <div class="mt-1"><svg class="i"><use href="#i-${icon}"/></svg></div>
          </summary>
          <div class="p-4 pt-0 text-sm">
            <p>${desc}</p>
            <a href="/planner/bands/${age}.md" class="inline-block mt-3 text-[#c5a46e] hover:underline">Open full room →</a>
          </div>
        </details>
      `);
    });
    document.getElementById("open-all").onclick = () => document.querySelectorAll("details").forEach(d => d.open = true);
    document.getElementById("close-all").onclick = () => document.querySelectorAll("details").forEach(d => d.open = false);
  </script>
</body>
</html>
