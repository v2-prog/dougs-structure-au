<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bracket — Economic Life Stages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
  <style>
    :root {
      --bg: #EEF1F0;
      --fg: #1B2321;
      --muted: #55625E;
      --font-display: "Bricolage Grotesque", system-ui, sans-serif;
      --font-body: "Figtree", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--fg); font-family: var(--font-body); margin: 0; padding: 24px 16px 48px; }
    .wrap { max-width: 1400px; margin: 0 auto; }
    h1 { font-family: var(--font-display); font-size: 2.2rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 28px; max-width: 60ch; }
    .row { margin-bottom: 28px; }
    .row-label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 600; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--c);
      color: var(--ink);
      border-radius: 12px;
      padding: 16px 12px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
    }
    .age { font-family: var(--font-mono); font-weight: 700; font-size: 1.6rem; margin-bottom: 12px; }
    .age small { font-size: 0.7rem; font-weight: 500; margin-left: 6px; opacity: 0.85; }
    .icons {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-top: auto;
    }
    .item {
      flex: 1;
      text-align: center;
      font-size: 0.72rem;
      line-height: 1.2;
      font-weight: 600;
    }
    .circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.16);
      margin: 0 auto 6px;
      display: grid;
      place-items: center;
    }
    .i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .item a { color: inherit; text-decoration: none; }
    footer { margin-top: 32px; color: var(--muted); font-size: 0.85rem; }
  </style>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h4l4 8M10 8l3 8"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6.5V8m0 8v1.5"/></symbol>
    <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/></symbol>
    <symbol id="i-job" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M9 8V6h6v2M3 13h18"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="M4 16v-4l2-5h12l2 5v4M4 16h16M4 16v2M20 16v2"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10M10 20v-6h4v6"/></symbol>
    <symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5zM6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c0-4 2.7-6 6.5-6s6.5 2 6.5 6"/></symbol>
    <symbol id="i-plane" viewBox="0 0 24 24"><path d="M21 4L3 11l7 2 2 7zM10 13L21 4"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.5-7 10-7 10z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></symbol>
    <symbol id="i-cross" viewBox="0 0 24 24"><path d="M10 4h4v6h6v4h-6v6h-4v-6H4v-4h6z"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></symbol>
    <symbol id="i-vote" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H20M17 12v3M20 12v2"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 012 2v12a2 2 0 00-2-2H4zM20 5h-6a2 2 0 00-2 2v12a2 2 0 012-2h6z"/></symbol>
    <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14 6a4 4 0 005 5l-9 9a2 2 0 01-3-3l9-9a4 4 0 00-2-2z"/></symbol>
  </svg>
</head>
<body>
  <div class="wrap">
    <h1>Economic life stages</h1>
    <p class="sub">Typical economic considerations in two-year age bands, ages 12 to 81, Australia.</p>
    <div id="rows"></div>
    <footer>
      <p>Averages for Australia. Age 60 preservation (born after 1 July 1964), Age Pension age 67. Educational only — not personal financial advice.</p>
    </footer>
  </div>
  <script>
    const ROWS = [
      { name: "Mountain View", c: "#4E7A6B", ink: "#FFFFFF" },
      { name: "Bronze", c: "#8C5E2F", ink: "#FFFFFF" },
      { name: "Khaki", c: "#C2B280", ink: "#2A2410" },
      { name: "Stormy Weather", c: "#5F6F78", ink: "#FFFFFF" },
      { name: "Dusty Cedar", c: "#A85F55", ink: "#FFFFFF" },
      { name: "Ocean Depths", c: "#2F5C6E", ink: "#FFFFFF" },
      { name: "Silver Birch", c: "#C9CBC4", ink: "#23272A" }
    ];
    const DATA = [
      [["bike","First bike"],["coin","Pocket money"],["ball","Clubs and hobbies"],["book","Starting high school"],["globe","Online life"]],
      [["job","First casual job"],["card","First bank account"],["phone","Own phone and plan"],["coin","Spending money"],["book","Subject choices"]],
      [["car","Learner licence"],["job","Part-time work"],["card","Tax and TFN"],["coin","First savings goal"],["cap","Choosing a pathway"]],
      [["vote","Adult rights"],["cap","University, TAFE or work"],["book","Student support"],["car","P plates"],["card","Credit and buy now pay later"]],
      [["car","First car"],["key","Share house or home"],["tool","Trade or study wages"],["shield","Insurance"],["coin","Early super"]],
      [["job","Graduate job"],["chart","Super building"],["book","HELP repayments"],["plane","Travel"],["key","Own rental"]],
      [["job","Mid-level role"],["shield","Insurance review"],["coin","House deposit"],["heart","Partner"],["chart","Salary growth"]],
      [["key","First home schemes"],["heart","Shared costs"],["chart","Pay rise"],["home","First purchase"],["shield","Will and life insurance"]],
      [["person","First child"],["coin","Parental leave"],["home","Larger home"],["coin","Childcare peak"],["job","Return to work"]],
      [["home","Mortgage peak"],["person","Second child"],["chart","Promotion"],["ball","Kids activities"],["job","Senior role"]],
      [["chart","Earnings rising"],["home","Renovations"],["coin","Extra repayments"],["book","School costs"],["car","Family car"]],
      [["heart","Supporting parents"],["card","Teen costs"],["chart","Higher tax"],["plane","Family holidays"],["job","Leadership or business"]],
      [["chart","Peak earnings"],["cap","Child at uni"],["home","Mortgage shrinking"],["coin","Catch-up super"],["key","Kids leaving home"]],
      [["chart","Highest income"],["home","Mortgage nearly paid"],["heart","Adult children"],["car","Long trips"],["cross","Health costs rise"]],
      [["sun","Empty nest"],["chart","Super grows fastest"],["plane","More travel"],["home","Downsizing"],["job","Phased retirement"]],
      [["coin","Super accessible"],["sun","Many retire"],["cross","Health spending"],["sun","Retirement"],["coin","Super pension"]],
      [["sun","Average retirement ~64-65"],["chart","Leisure spending"],["shield","Seniors Card"],["coin","Age Pension from 67"],["cross","Medicare costs"]],
      [["home","Home equity main asset"],["coin","Pension + drawdown"],["cross","Health costs"],["heart","Grandchildren"],["coin","Minimum drawdowns"]],
      [["home","Maintenance or downsize"],["car","Driving less"],["cross","Specialist care"],["heart","Family gifts"],["coin","Steady pension"]],
      [["home","Home modifications"],["cross","Hospital and dental"],["coin","Fixed-income budget"],["heart","Power of attorney"],["person","Family support"]],
      [["heart","Estate planning"],["cross","Health services"],["home","Retirement living"],["home","Village or home care"],["cross","Home Care Package"]],
      [["coin","Aged care means test"],["cross","Respite"],["person","Family support"],["cross","Aged care costs"],["heart","Family support"]],
      [["shield","Settling the estate"],["cross","Health"],["heart","Legacy gifts"],["home","Care planning"],["coin","Fixed income"]]
    ];
    function icon(n) { return `<svg class="i"><use href="#i-${n}"/></svg>`; }
    const root = document.getElementById("rows");
    ROWS.forEach((row, r) => {
      const start = 12 + r * 10;
      let html = `<section class="row" style="--c:${row.c};--ink:${row.ink}">
        <div class="row-label"><span class="swatch"></span>${row.name} · ages ${start} to ${start+9}</div>
        <div class="grid">`;
      for (let k = 0; k < 5; k++) {
        const age = start + k * 2;
        const items = DATA[r * 5 + k] || [];
        html += `<div class="card">
          <div class="age">${age}–${age+1}<small>years</small></div>
          <div class="icons">`;
        items.slice(0,5).forEach(([ic, label]) => {
          html += `<div class="item"><a href="/details/${ic}.html" title="${label}"><div class="circle">${icon(ic)}</div>${label}</a></div>`;
        });
        html += `</div></div>`;
      }
      html += `</div></section>`;
      root.insertAdjacentHTML("beforeend", html);
    });
  </script>
</body>
</html>
