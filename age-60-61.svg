  <circle cx="438" cy="116" r="38" fill="#FFFFFF" fill-opacity="0.16"/>
  <g transform="translate(410,88) scale(2.3333)" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></g>
