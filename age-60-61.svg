<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-labelledby="t d">
  <title id="t">Ages 60–61: economic life stage</title>
  <desc id="d">Five economic considerations: Super preservation age, Many cut back or retire, Health spending, Transition to retirement, Home equity.</desc>
  <rect width="640" height="240" rx="14" fill="#A85F55"/>
  <text x="28" y="56" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">60–61<tspan font-size="15" font-weight="400" dx="8">years</tspan></text>
  <text x="612" y="52" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.85">Dusty Cedar</text>
  <circle cx="72" cy="116" r="38" fill="#FFFFFF" fill-opacity="0.16"/>
  <g transform="translate(44,88) scale(2.3333)" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6.5V8m0 8v1.5"/></g>
