  <title id="t">Ages 18–19: economic life stage</title>
  <desc id="d">Five economic considerations: Adult rights, University, TAFE or work, Student support, P plates, Credit and buy now pay later.</desc>
  <rect width="640" height="240" rx="14" fill="#4E7A6B"/>
